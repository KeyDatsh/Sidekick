[package]
name = "sidekick-speech"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sidekick's speech worker: call audio -> Whisper -> Opus-MT, one JSON line per subtitle"

# Own workspace: it needs the CUDA Toolkit, libclang and a static C runtime (see build.sh), the app does not.
[workspace]

[dependencies]
whisper-rs = { version = "0.16", features = ["cuda", "log_backend"] }
log = "0.4"
ct2rs = { version = "0.11", default-features = false, features = ["sentencepiece", "ruy", "cuda"] }
cpal = "0.17"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"

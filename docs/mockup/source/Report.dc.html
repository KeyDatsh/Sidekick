<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Денний звіт для Upwork</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#60cdff}a:hover{color:#99ebff}
</style>
</helmet>
<div style="width: 640px; height: 400px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 8px; background: rgba(32,32,32,0.96); border: 1px solid rgba(255,255,255,0.10); font-family: 'Segoe UI Variable', 'Segoe UI', Inter, sans-serif; color: #ffffff;">
  <div style="display: flex; align-items: baseline; gap: 8px;">
    <span style="font-size: 14px; font-weight: 600;">Звіт за середу, 25 листопада</span>
    <span style="font-size: 11px; color: #c5c5c5;">із задач і 6 сесій Claude Code</span>
    <span style="flex-grow: 1;"></span>
    <span style="font-size: 12px; color: #c5c5c5;">Разом 7,5 год</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 12px; font-weight: 600;">{{r.client}}</span>
          <span style="flex-grow: 1;"></span>
          <button aria-label="Менше часу" style="width: 24px; height: 24px; font: inherit; font-size: 14px; color: #ffffff; background: rgba(255,255,255,0.08); border: 0; border-radius: 4px;">−</button>
          <span style="font-size: 12px; min-width: 44px; text-align: center;">{{r.hours}}</span>
          <button aria-label="Більше часу" style="width: 24px; height: 24px; font: inherit; font-size: 14px; color: #ffffff; background: rgba(255,255,255,0.08); border: 0; border-radius: 4px;">+</button>
          <button aria-label="Копіювати запис" style="width: 28px; height: 24px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60cdff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 8px;">
          <span lang="en" style="flex-grow: 1; font-size: 13px; line-height: 1.35; color: #ffffff;">{{r.memo}}</span>
          <span style="font-size: 11px; color: {{r.countColor}}; white-space: nowrap;">{{r.count}}</span>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 8px;">
    <span style="font-size: 11px; color: #c5c5c5;">Час розподіляєш сам, текст можна правити.</span>
    <span style="flex-grow: 1;"></span>
    <button style="font: inherit; font-size: 13px; color: #ffffff; background: rgba(255,255,255,0.08); border: 0; border-radius: 6px; padding: 8px 12px;">Перегенерувати</button>
    <button style="font: inherit; font-size: 13px; font-weight: 600; color: #002a3a; background: #60cdff; border: 0; border-radius: 6px; padding: 8px 14px;">Копіювати все</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":400}}'>
class Component extends DCLogic {
renderVals() {
const row = (client, hours, memo) => ({ client, hours, memo, count: memo.length + ' / 140', countColor: memo.length > 140 ? '#ff99a4' : '#8a8d94' });
return { rows: [
row('Клієнт A · Mobile', '3,5 год', 'Fixed mobile login token refresh, updated auth API and added tests for expired sessions.'),
row('Клієнт B · Dashboard', '2,5 год', 'Reviewed payments PR, started CSV export for reports page.'),
row('Клієнт C · Landing', '1,5 год', 'Answered design questions, adjusted hero layout for mobile.')
] };
}
}
</script>
</body>
</html>

[package]
name = "speech-rs"
version = "0.0.0"
edition = "2021"
publish = false
description = "Stage 0 prototype: whisper-rs (CUDA) and ct2rs linked into one Rust binary"

[dependencies]
whisper-rs = { version = "0.16", features = ["cuda"] }
ct2rs = { version = "0.11", default-features = false, features = ["sentencepiece", "ruy"] }
hound = "3.5"
